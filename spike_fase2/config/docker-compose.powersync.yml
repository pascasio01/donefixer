# SPIKE FASE 2 — configuración de evaluación (EXENCIÓN-SPIKE-01 / DC-03). No es producción.
# Entorno B: PowerSync Self-Hosted + PostgreSQL dedicado de réplica, ambos reproducibles.
# Uso: docker compose -f docker-compose.powersync.yml up -d
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: spike
      POSTGRES_DB: spike
    command: >
      postgres -c wal_level=logical
               -c max_wal_senders=4
               -c max_replication_slots=4
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 20

  powersync:
    image: ghcr.io/powersync-ja/powersync-service:latest   # fijar tag exacto en Carril B y registrarlo en el Anexo
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./powersync.yaml:/config/powersync.yaml
    ports:
      - "8080:8080"
    command: ["start", "-c", "/config/powersync.yaml"]
